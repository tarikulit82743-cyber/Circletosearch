name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q CircleSearch.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APKs
        working-directory: CircleSearch
        run: gradle assembleDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CircleSearch-apk
          path: |
            CircleSearch/app/build/outputs/apk/debug/*.apk
            CircleSearch/app/build/outputs/apk/release/*.apk
